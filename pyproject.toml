[project]
name = "shortpay"
version = "0.1.0"
description = "Evidence-backed freight invoice auditing with deterministic short-pay decisions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.10.0",
  "pydantic-ai>=2.40.0",
  "openai>=3.8.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "requests>=2.31.0,<3.0.0",
  "neatlogs>=1.4.21",
  "flask>=3.0.0,<4.0.0",
  "pypdf>=6.17.0",
  "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider"]
markers = [
  "integration: calls configured live sponsor endpoints and may incur latency or usage",
]
