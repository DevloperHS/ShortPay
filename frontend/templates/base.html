<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Shortpay{% endblock %}</title>
    <script>
      (() => {
        try {
          const theme = window.localStorage.getItem('shortpay-theme');
          if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
        } catch (_) {}
      })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('dashboard.board') }}">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <path d="M5 9.5h14v11H5zM19 13h4.6l3.4 4v3.5H19z" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"/>
            <circle cx="10" cy="23" r="2.5" stroke="currentColor" stroke-width="2.1"/>
            <circle cx="23" cy="23" r="2.5" stroke="currentColor" stroke-width="2.1"/>
            <path d="M5 20.5h2.5M12.5 20.5h8M25.5 20.5H27" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-copy"><strong>Shortpay</strong><small>Freight audit desk</small></span>
      </a>
      <div class="header-meta">
        <span class="header-context">Pre-pay control room</span>
        <span class="status"><span class="status-dot"></span> Audit service online</span>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark color theme" aria-pressed="false">
          <span class="theme-toggle-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2.25M12 19.75V22M2 12h2.25M19.75 12H22M4.93 4.93l1.59 1.59M17.48 17.48l1.59 1.59M19.07 4.93l-1.59 1.59M6.52 17.48l-1.59 1.59"/></svg>
          </span>
          <span data-theme-label>Light desk</span>
        </button>
      </div>
    </header>

    <main class="page-shell">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
    <script>
      (() => {
        const toggle = document.querySelector('[data-theme-toggle]');
        if (!toggle) return;
        const label = toggle.querySelector('[data-theme-label]');
        const applyTheme = (theme) => {
          document.documentElement.dataset.theme = theme;
          const isDark = theme === 'dark';
          toggle.setAttribute('aria-pressed', String(isDark));
          toggle.setAttribute('aria-label', `Switch to ${isDark ? 'light' : 'dark'} color theme`);
          label.textContent = isDark ? 'Dark desk' : 'Light desk';
        };

        applyTheme(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light');
        toggle.addEventListener('click', () => {
          const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
          applyTheme(theme);
          try { window.localStorage.setItem('shortpay-theme', theme); } catch (_) {}
        });
      })();
    </script>
  </body>
</html>
